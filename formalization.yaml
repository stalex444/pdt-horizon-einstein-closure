fidelity:
  divergences: >-
    Jacobson's differential-geometric and quantum-field argument is represented
    by its local null-contraction premise followed by a fully formalized
    finite-dimensional tensor closure. Its variables are unit-free real
    matrices; the physical reading uses electron-mass natural units so the
    Einstein coefficient is 8 pi alpha_G, where
    alpha_G = G_N m_e^2/(hbar c). With
    ell_e = hbar/(m_e c), curvature is scaled by ell_e^2, stress by the
    electron rest-energy density m_e c^2/ell_e^3, area by ell_e^2, and the
    cosmological term by ell_e^2. Undoing those normalizations gives the usual
    coefficient 8 pi G_N/c^4. Faulkner-Speranza's interacting
    horizon algebra is represented by an explicit two-channel affine optical
    model and a scalar horizon residual. The Hodge divide is an exact
    finite-dimensional model of the proposed chiral assignment, not a
    derivation of that assignment from physical curvature. The deposited PDT gravity paper
    supplies the rho Q coupling proposal, the physical selection of exponent 224, and
    the quartic screening formula. The identification of 1/Q with a physical
    horizon KMS/core line is a later premise developed in this repository and
    its accompanying note. This artifact formalizes the Lie-theoretic chain
    `dim so(4,2)=15`, `dim sl(15)=224=15+209`; it does not prove the physical
    identification of that dimension as gravity's exponent. The Jacobson, Faulkner-Speranza, and
    Witten sources do not contain the PDT assignments. No global
    curved-spacetime equivalence is claimed.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    The recovered source was audited on 2026-09-09. Metadata and theorem
    names were synchronized with the conformal response-space formulation.
    The Solution source has
    no sorry, admit, or added axiom. The Challenge/Solution types are selected
    by comparator.json. Literature attribution distinguishes the standard
    horizon and null-cone framework from the PDT-specific placement.
    Two independent AI review passes examined theoretical-physics scope and
    Palomar statement alignment; their findings and documentation corrections
    are recorded in PRE_SUBMISSION_REVIEW.md. This was not human peer review
    or official Palomar verification.
    A subsequent rendering compatibility redraft factors each original
    quantified statement into a fixed named proposition. Comparator's
    definition_names remains empty, so the proposition bodies are ordinary
    checked dependencies. Exact full-statement copies are included in the
    theorem documentation for Palomar's partial declaration view and checked
    by scripts/check_render_statements.py. The original proof types are
    preserved; see RENDER_COMPATIBILITY.md for validation and limitations.

alignment:
  namespace: HorizonEinsteinClosure
  statements:
    - source: Structural conformal orbit--stabilizer exponent
      lean: HorizonEinsteinClosure.gravityExponentFromConformalResponseSpace
      module: Solution
      status: proved
      note: >-
        Proves the actual Mathlib Lie algebra so'(4,2) has dimension 15,
        evaluation of trace-free real endomorphisms at any nonzero conformal
        generator is surjective, its kernel has dimension 209, and
        rank--nullity yields 224 = 15 + 209. The response exponent is defined
        as the dimension of this endomorphism space; the theorem computes it
        as 224 and proves the scalar determinant is scale^224. The final physical assignment
        of this dimension as gravity's exponent remains the PDT identification.
    - source: Integrated horizon-to-Einstein closure
      lean: HorizonEinsteinClosure.horizonEinsteinClosure
      module: Solution
      status: proved
      note: >-
        One declaration explicitly states the KMS/core boundary assumptions,
        affine optical classification, positive-branch null-ray realization,
        Raychaudhuri-form identity, shear-flux/area identity, conditional
        horizon balance, irrational rho Q clocks, local Einstein equation, and
        determinant identity for the defined exponent-224 block. The cubic
        root rho (p) enters the joint bulk determinant and the exact
        orientation-paired Hodge divide; Q enters that joint product and the
        separate normalized screen response. The horizon balance and Einstein
        coefficient use the same defined dimensionless alphaG_PDT. This means
        the theorem uses the same scalar in its two displayed premises; it
        does not prove that those premises are jointly realized physically.
    - source: Hodge bulk and quartic screen products
      lean: HorizonEinsteinClosure.hodgeBulkAndQuarticScreen
      module: Solution
      status: proved
      note: >-
        For arbitrary real rho and nonzero q, states two distinct operator
        identities: pairing the two weighted orientations gives (rho q)I,
        and the normalized response and its flip give ((2q-1)/q^2)I. The
        integrated capstone specializes rho and q to the positive cubic and
        quartic roots. The theorem does not identify the two operators or
        infer their physical placement from the algebra.
    - source: Quartic KMS boundary classification
      lean: HorizonEinsteinClosure.kmsBoundarySelectsOpticalFlow
      module: Solution
      status: proved
      note: >-
        For an arbitrary two-by-two response satisfying the stated symmetry,
        normalization, and core-line conditions, the whole affine flow is
        forced up to orientation; both branches have the same determinant,
        quadratic flux, area loss, and defined conditional horizon update.
    - source: Explicit null-ray family and Raychaudhuri-form identity
      lean: HorizonEinsteinClosure.quarticNullCongruenceRaychaudhuri
      module: Solution
      status: proved
      note: >-
        Constructs null tangents and the exact transverse separation map, then
        proves the derivative and scalar identity having the vacuum
        Raychaudhuri form throughout the nonsingular unit interval.
    - source: Four-dimensional null-cone rigidity
      lean: HorizonEinsteinClosure.nullConeRigidity4
      module: Solution
      status: proved
      note: >-
        A symmetric form vanishing quadratically on every Minkowski-null
        vector is a scalar metric multiple. The source proof uses explicit
        rational null probes rather than importing a classification theorem.
    - source: Null Clausius to Einstein tensor
      lean: HorizonEinsteinClosure.nullClausiusForcesLocalEinsteinShape
      module: Solution
      status: proved
      note: >-
        Applies null-cone rigidity to Ricci minus kappa times stress and
        produces the local Einstein-tensor equation with one cosmological
        scalar.

