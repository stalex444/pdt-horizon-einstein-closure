status:
  scope: >-
    The compared declarations prove a conditional mathematical package. An
    assumed 1/Q exchange-line eigenweight plus symmetry and normalization
    classify an affine two-channel screen history up to orientation. The
    explicit screen functions satisfy exact null-ray, optical-scalar,
    Raychaudhuri-form, flux, and conditional area-balance identities. Given a
    separate dimensionless local null Clausius contraction in electron-mass
    natural units with the repository-defined rho Q coupling, null-cone
    rigidity forces the Einstein-tensor shape. The
    integrated theorem also includes the exact determinant identity for the
    exponent-224 block. A separately selected theorem derives
    224 = dim sl(dim so(4,2)) and its 15 + 209 orbit--stabilizer split. The
    comparison also includes the separate Hodge-pair products exposing the
    rho Q bulk scalar and quartic screen scalar, and the irrational
    modular-clock relation.
    The cubic root rho (p) enters through every direction of the joint
    (rho Q)^224 bulk block; Q additionally supplies the proposed two-channel
    boundary weight and determinant. It does not prove that physical curvature
    assigns rho and Q to the two Hodge chiralities, that an interacting horizon
    carries the proposed 1/Q line, derive the initial horizon residual or
    Clausius premise from quantum fields, prove that the structural dimension
    224 must be physically assigned as the gravity exponent, construct a global nonlinear spacetime, prove the
    differential Bianchi identity, or validate the coupling against experiment.
    The physical proposal identifies the defined scalar with
    alpha_G = G_N m_e^2/(hbar c); dimensional G_N is recovered only after
    restoring that normalization.
