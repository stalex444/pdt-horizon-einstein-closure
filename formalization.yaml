status:
  scope: >-
    The compared declarations prove a conditional mathematical bridge: static
    quartic KMS boundary data classify a complete affine null-screen history;
    the history obeys exact Raychaudhuri focusing and modular area balance;
    and the local null Clausius contraction forces the Einstein-tensor shape
    with the displayed rho-Q coupling. The integrated theorem explicitly
    includes the exponent-224 determinant and the irrational modular-clock
    relation. It does not prove that a physical interacting horizon carries
    the proposed 1/Q line, derive the Clausius premise from quantum fields,
    construct a global nonlinear spacetime, prove the differential Bianchi
    identity, or validate the numerical coupling against experiment.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - propext
    - Classical.choice
    - Quot.sound
  main_results:
    - declaration: HorizonEinsteinClosure.horizonEinsteinClosure
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: A local horizon Clausius relation yields a null-contracted Ricci-versus-stress relation.
          source: "Thermodynamics of Spacetime: The Einstein Equation of State"
        - statement: Horizon gravitational null energy contains a quadratic shear term and horizon-cut area is related to a one-sided modular Hamiltonian.
          source: Gravitational algebras and the generalized second law
    - declaration: HorizonEinsteinClosure.kmsBoundarySelectsOpticalFlow
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: HorizonEinsteinClosure.quarticNullCongruenceRaychaudhuri
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: The horizon gravitational null-energy response is quadratic in perturbative shear around a Killing horizon.
          source: Gravitational algebras and the generalized second law
    - declaration: HorizonEinsteinClosure.nullConeRigidity4
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: HorizonEinsteinClosure.nullClausiusForcesLocalEinsteinShape
      file: Solution.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
      literature_dependencies:
        - statement: The local thermodynamic derivation requires the null-contracted tensor relation for every local null generator.
          source: "Thermodynamics of Spacetime: The Einstein Equation of State"

automation:
  methods:
    - method: agent
      models:
        - OpenAI GPT-family; exact model revision not recorded
      framework: Codex
      tool_setup: >-
        Human-directed theorem design, Lean compiler iteration, dependency
        extraction, and Palomar packaging. Lean 4.31.0 and Mathlib commit
        fabf563a7c95a166b8d7b6efca11c8b4dc9d911f were pinned. Challenge
        imports only Mathlib. Solution reconstructs the compared declarations
        from independently compiled source modules and direct kernel proofs.
      cost:
        wall_time: Sessions through 2026-09-08; cumulative elapsed effort not tracked
        spend_usd: not tracked
        hardware: local machine
      prompting_notes: >-
        Stephanie Alexander supplied the PDT research program, required the
        complete rho-Q coupling and horizon mechanism to remain visible, and
        directed preparation of a focused public repository. The comparison
        surface was designed to avoid presenting isolated algebraic
        corollaries as the main result: one capstone states the entire
        boundary-to-Einstein chain, with four independently compared support
        theorems. Physical assumptions are named in the theorem hypotheses.
  spend_usd: not tracked
  notes: >-
    Kernel verification establishes the formal implications. It is not
    independent peer review and does not validate the physical KMS placement
    or the empirical value of the coupling.

fidelity:
  divergences: >-
    Jacobson's differential-geometric and quantum-field argument is represented
    by its local null-contraction premise followed by a fully formalized
    finite-dimensional tensor closure. Faulkner-Speranza's interacting
    horizon algebra is represented by an explicit two-channel affine optical
    model and a scalar horizon residual. The quartic 1/Q KMS placement, the
    rho-Q coupling definition, and the exponent 224 are additional PDT inputs
    stated openly. The sources do not contain those assignments. No global
    curved-spacetime equivalence is claimed.

review:
  status: self-assessed
  reviewers: []
  notes: >-
    The package was rebuilt from the pinned toolchain. The Solution source has
    no sorry, admit, or added axiom. The Challenge/Solution types are selected
    by comparator.json. Literature attribution distinguishes the standard
    horizon and null-cone framework from the PDT-specific placement.

alignment:
  namespace: HorizonEinsteinClosure
  statements:
    - source: Integrated horizon-to-Einstein closure
      lean: HorizonEinsteinClosure.horizonEinsteinClosure
      module: Solution
      status: proved
      note: >-
        One declaration explicitly states the KMS boundary assumptions, full
        affine optical classification, null congruence, Raychaudhuri equation,
        shear-flux/area identity, horizon balance, irrational rho-Q clocks,
        local Einstein equation, and exponent-224 determinant.
    - source: Quartic KMS boundary classification
      lean: HorizonEinsteinClosure.kmsBoundarySelectsOpticalFlow
      module: Solution
      status: proved
      note: >-
        For an arbitrary two-by-two response satisfying the stated symmetry,
        normalization, and core-line conditions, the whole affine flow is
        forced up to orientation; both branches have the same determinant,
        quadratic flux, area loss, and horizon update.
    - source: Explicit null congruence and Raychaudhuri focusing
      lean: HorizonEinsteinClosure.quarticNullCongruenceRaychaudhuri
      module: Solution
      status: proved
      note: >-
        Constructs null tangents and the exact Jacobi cross-section, then
        proves the derivative and vacuum Raychaudhuri identity throughout the
        nonsingular unit interval.
    - source: Four-dimensional null-cone rigidity
      lean: HorizonEinsteinClosure.nullConeRigidity4
      module: Solution
      status: proved
      note: >-
        A symmetric form vanishing quadratically on every Minkowski-null
        vector is a scalar metric multiple. The source proof uses explicit
        rational null probes rather than importing a classification theorem.
    - source: Null Clausius to Einstein tensor
      lean: HorizonEinsteinClosure.nullClausiusForcesLocalEinsteinShape
      module: Solution
      status: proved
      note: >-
        Applies null-cone rigidity to Ricci minus kappa times stress and
        produces the local Einstein-tensor equation with one cosmological
        scalar.

