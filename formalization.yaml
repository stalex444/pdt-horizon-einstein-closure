version: v0.4

project:
  name: From a quartic KMS horizon line to local Einstein closure
  description: >-
    Five compared declarations formalize one conditional horizon-to-Einstein
    chain. Exchange symmetry, unit normalization, and a quartic 1/Q KMS/core
    eigenweight classify an arbitrary two-channel boundary response and force
    its complete affine optical flow up to orientation. The flow is realized
    as the transverse Jacobi map of explicit affine null geodesics, satisfies
    the twist-free vacuum Raychaudhuri equation, and has boost-weighted shear
    flux exactly equal to its missing endpoint area. The horizon constraint
    fixes the corresponding modular-energy update. A constructive
    four-dimensional null-cone rigidity theorem then converts the local null
    Clausius contraction into the Einstein-tensor equation. The integrated
    capstone retains the complete rho-Q response determinant with exponent
    224 and the irrational independence of the two modular clocks. The
    physical placement of the quartic KMS line and the local Clausius
    contraction are explicit hypotheses rather than claimed consequences of
    the finite algebra.
  authors:
    - Stephanie Alexander
  license: MIT
  responsible_maintainers:
    - Stephanie Alexander

repository:
  role: substantive-development

classification:
  arxiv:
    - math-ph
    - gr-qc
  msc2020:
    - "83C05"
    - "83C47"
    - "81R15"

sources:
  - title: "Thermodynamics of Spacetime: The Einstein Equation of State"
    authors:
      - Ted Jacobson
    id: DOI:10.1103/PhysRevLett.75.1260
    type: article
    location: https://arxiv.org/abs/gr-qc/9504004
    relationship: formalizes
    author_endorsement: not-contacted
    note: >-
      Source for the local horizon Clausius argument and the null-contracted
      Ricci-versus-stress relation. The compared null-cone theorem formalizes
      the pointwise algebraic step from that contraction to the Einstein
      tensor. This repository assumes the local Clausius contraction and does
      not claim to re-formalize Jacobson's quantum-field-theoretic premises.
  - title: Gravitational algebras and the generalized second law
    authors:
      - Thomas Faulkner
      - Antony J. Speranza
    type: article
    location: https://arxiv.org/abs/2405.00847
    relationship: adapts
    author_endorsement: not-contacted
    note: >-
      Source for the modern horizon-cut crossed-product setting, the
      one-sided modular-Hamiltonian/area relation, and the quadratic shear
      contribution to gravitational null energy. The formalization adapts
      those structures to an explicit finite optical flow. The source does
      not select the quartic number Q or the PDT boundary placement.
  - title: Gravity and the Crossed Product
    authors:
      - Edward Witten
    type: article
    location: https://arxiv.org/abs/2112.12828
    relationship: background
    author_endorsement: not-contacted
    note: >-
      Background for the modular crossed product, the gravitational
      type-II algebra, its trace, and generalized-entropy interpretation.
      No claim is made that this source contains the finite quartic model.
  - title: PDT horizon-to-Einstein closure proof map
    authors:
      - Stephanie Alexander
    type: research note
    location: PROOF_MAP.md
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Gives the exact theorem dependency table, separates kernel implications
      from physical premises, and states the falsifiers for the two placement
      assumptions. This is a source-to-code record and makes no independent
      literature-priority claim.
  - title: The Perron optical flow
    authors:
      - Stephanie Alexander
    type: research note
    location: PERRON_OPTICAL_RAYCHAUDHURI.md
    relationship: formalizes
    author_endorsement: participated
    note: >-
      States the explicit affine null congruence, its Jacobi map, optical
      tensors, Raychaudhuri equation, and horizon energy-area balance.
  - title: KMS selection of the horizon shear
    authors:
      - Stephanie Alexander
    type: research note
    location: KMS_OPTICAL_BOUNDARY_SELECTION.md
    relationship: formalizes
    author_endorsement: participated
    note: >-
      States the response-classification problem and the unique optical flow
      up to orientation, conditional on the displayed quartic KMS placement.
  - title: From the local Clausius relation to the Einstein tensor
    authors:
      - Stephanie Alexander
    type: research note
    location: LOCAL_EINSTEIN_CLOSURE.md
    relationship: formalizes
    author_endorsement: participated
    note: >-
      States the constructive four-dimensional null-cone rigidity result and
      its application to the local Einstein-tensor equation.

