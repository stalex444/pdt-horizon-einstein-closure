version: v0.4

project:
  name: From a pQ bulk response and quartic horizon line to local Einstein closure
  description: >-
    Seven compared declarations formalize a conditional package with an
    exact structural exponent theorem, an optical/horizon branch, and a
    separate Clausius-to-Einstein branch. The exponent theorem proves
    dim so(4,2) = 15, surjectivity of the defining sl(15) action at every
    nonzero vector, stabilizer dimension 209, and
    dim sl(15) = 224 = 15 + 209. A Hodge-pair theorem then keeps the rho Q weighted divide distinct
    from the normalized quartic response while proving their exact
    orientation-paired products, (rho Q)I and (1-lambda4^2)I. An assumed 1/Q
    exchange-line eigenweight, proposed as the quartic
    KMS/core line, together with exchange symmetry and unit normalization,
    classifies an arbitrary two-channel boundary response and its entire
    affine screen flow into one of two global orientation branches. The
    positive branch is the transverse map of explicit affine null rays in
    flat double-null coordinates; its defined expansion and shear satisfy an
    exact identity having the twist-free vacuum Raychaudhuri form. The two
    orientations have the same scalar determinant and shear-square data, and
    the normalized boost-weighted shear flux equals the missing endpoint
    area. A defined modular-energy increment preserves an
    assumed scalar horizon residual. Given the separate local null Clausius
    premise, a constructive four-dimensional null-cone rigidity theorem
    produces the Einstein-tensor form. The integrated capstone also retains
    the exact determinant identity for the repository-defined alphaG_PDT with the
    exponent computed as 224, and the irrational independence of the two modular
    clocks. Here rho, also denoted p, enters the bulk factor through
    (rho Q)^224; Q enters both that joint factor and the separate horizon
    determinant. The physical Hodge assignment, KMS-line placement, initial
    horizon residual, dimensionless Clausius premise with alphaG_PDT, and
    empirical identification alphaG_PDT = G_N m_e^2/(hbar c) are not claimed
    consequences of the finite algebra.
  authors:
    - Stephanie Alexander
  license: MIT
  responsible_maintainers:
    - Stephanie Alexander

