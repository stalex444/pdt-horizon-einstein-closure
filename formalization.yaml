version: v0.4
project:
  name: Hodge-generated response algebras and finite-cut optical balance
  description: The principal result proves that the fifteen adjoint basis actions of the orthogonal
    algebra for diag(1,1,1,-1,1,-1), together with the Hodge operation on the oriented four-plane 0123
    extended by zero, generate every trace-free 15-by-15 matrix. The theorem holds over every field
    with two nonzero and derives the dimension 224 from that closure. An integral finite certificate
    is combined with a general matrix-unit propagation proof and geometric definitions calculated
    from 6-by-6 brackets. Its response-rigidity clause further proves that covariance under the
    same sixteen generators forces a scalar endomorphism on the 224-dimensional algebra, with
    determinant c^224. No simplicity or algebraic-closure hypothesis is needed. Companion results establish an orthogonal affine null family from a quadratic
    initial cut, exact finite-cut optical energy balance with endpoint expansion, and the necessary
    and sufficient scalar-product condition for a two-sided response to preserve trace zero. The
    selected contribution is a constructive Lie-generation theorem; physical operator selection,
    the scalar response magnitude, entropy coefficient and Newton coupling remain separate questions.
  authors:
  - Stephanie Alexander
  license: MIT
  responsible_maintainers:
  - Stephanie Alexander
