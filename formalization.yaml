fidelity:
  divergences: The principal statement uses fixed integral coordinates for an orthogonal adjoint
    representation and a chosen local Hodge operator, extended to arbitrary fields with 2!=0. It
    does not claim all signatures, all four-planes, or a classification of every possible response
    algebra. An exact certificate is used to prove the closure; a general Lie-theoretic classification
    is not imported. The optical theorems are flat-coordinate geometry and real-analysis consequences
    of stated optical equations, not a global Lorentzian manifold or interacting quantum-horizon
    construction. The two-sided trace-preservation theorem constrains possible response laws but
    does not assert that the physical law is two-sided. The original 2D Hodge divide and the 224D linear response are distinguished explicitly. The
    latter is now forced to be scalar under generator covariance; its physical scalar calibration
    remains explicit. The intended research-interest case
    concerns constructive/formalized representation theory; global novelty remains unestablished.
